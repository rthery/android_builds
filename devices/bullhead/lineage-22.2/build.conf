BUILD_PRODUCT=lineage_bullhead-bp1a-userdebug
BUILD_SOURCE_DIR=/work/src/lineage-22.2
BUILD_MANIFEST_BRANCH=lineage-22.2
BUILD_RECIPE_MANIFEST=bullhead.xml
BUILD_RELEASE_ALLOWED=1
# Regenerated in every release build from the blob commit pinned for this path.
BUILD_VENDOR_PATH=vendor/lge/bullhead
BUILD_EXTRACT=device/lge/bullhead/extract-files.py
# Local builds read the same file, so module builds after a release keep its fingerprint.
BUILD_NUMBER_FILE=out/.l22-build-number
build_env() {
  # Native aarch64 JDK; $PLATFORM gives aarch64 processes an empty preload shim.
  export LD_PRELOAD='/work/.local/build-jdk/preload/$PLATFORM/libmap32.so'
  export OVERRIDE_ANDROID_JAVA_HOME=prebuilts/jdk-local/linux-arm64
  # signapk on the aarch64 JDK loads Conscrypt's arch-specific JNI name first.
  install -D -m 0444 /work/.local/build-jdk/conscrypt/libconscrypt_openjdk_jni-linux-aarch_64.so \
    out/host/linux-x86/lib64/libconscrypt_openjdk_jni-linux-aarch_64.so
}
BUILD_PACKAGE_PREFIX=lineage-
# Must match lineage.updater.uri in the device tree; /e/OS builds use their own feed file.
BUILD_FEED_ASSET=lineage22-bullhead.json
