name: Android build

on:
  # Weekly lineage-22.2 release build after the upstream bot's merge; skipped when no source changed.
  schedule:
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      device:
        description: Device codename from devices/<codename>
        required: true
        type: string
        default: bullhead
      tree:
        description: Source tree (eos-t, or a devices/<codename>/<tree> recipe)
        required: true
        type: choice
        options:
          - eos-t
          - lineage-22.2
      mode:
        description: Build operation
        required: true
        type: choice
        options:
          - verify
          - development
          - release
          - publish
      build_run:
        description: For publish, the id of the release run whose signed build to publish again
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the recipe and upstream with the last release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I scripts/upstream-check.py bullhead lineage-22.2 --report "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/results.json" || true
          changed=$(python3 -I -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["changed"]).lower())' "$RUNNER_TEMP/results.json")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true') &&
      github.actor == 'rthery' && github.triggering_actor == 'rthery' && github.ref == 'refs/heads/main' && (inputs.mode || 'release') != 'publish'
    runs-on: [self-hosted, Linux, X64, rom-builder]
    timeout-minutes: 1440
    # Only the build shares the source tree; release runs waiting for approval do not hold it.
    concurrency:
      group: rom-builder
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow revision
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${SERVER_URL}/${REPOSITORY}.git"
          else
            git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          fi
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --force --detach FETCH_HEAD

      - name: Run the shared build wrapper
        id: build
        env:
          DEVICE: ${{ inputs.device || 'bullhead' }}
          TREE: ${{ inputs.tree || 'lineage-22.2' }}
          MODE: ${{ inputs.mode || 'release' }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" "$MODE" "$TREE"

      - name: Attest the target-files
        if: (inputs.mode || 'release') == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.target_files }}

  # Waits for the maintainer: the package is signed locally (scripts/release.sh), then the
  # testing environment is approved and the release goes up as a prerelease.
  testing:
    needs: build
    # publish skips the build and takes the signed build of an earlier release run.
    if: always() && github.actor == 'rthery' && github.triggering_actor == 'rthery' && github.ref == 'refs/heads/main' && (((inputs.mode || 'release') == 'release' && needs.build.result == 'success') || ((inputs.mode || 'release') == 'publish' && inputs.build_run != ''))
    runs-on: [self-hosted, Linux, X64, rom-builder]
    timeout-minutes: 120
    environment:
      name: testing
      url: ${{ steps.upload.outputs.release_url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow revision
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --force --detach FETCH_HEAD

      - name: Check the signed package
        id: prepare
        env:
          DEVICE: ${{ inputs.device || 'bullhead' }}
          TREE: ${{ inputs.tree || 'lineage-22.2' }}
          BUILD_RUN: ${{ (inputs.mode || 'release') == 'publish' && inputs.build_run || github.run_id }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" publish "$TREE" prepare "$BUILD_RUN" false

      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.prepare.outputs.package }}
            ${{ steps.prepare.outputs.recovery }}

      - name: Publish the prerelease
        id: upload
        env:
          DEVICE: ${{ inputs.device || 'bullhead' }}
          TREE: ${{ inputs.tree || 'lineage-22.2' }}
          BUILD_RUN: ${{ (inputs.mode || 'release') == 'publish' && inputs.build_run || github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" publish "$TREE" upload "$BUILD_RUN" false

  # Approved after the OTA test on a phone: marks the release as latest and offers it in the Updater.
  release:
    needs: testing
    if: always() && needs.testing.result == 'success'
    runs-on: [self-hosted, Linux, X64, rom-builder]
    timeout-minutes: 120
    environment:
      name: release
      url: ${{ steps.upload.outputs.release_url }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow revision
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --force --detach FETCH_HEAD
          # Release notes are written after the build: take them from main, everything else from this run.
          git fetch --depth=1 origin refs/heads/main
          git checkout FETCH_HEAD -- ':(glob)devices/*/*/CHANGELOG.md'

      - name: Check the published package
        env:
          DEVICE: ${{ inputs.device || 'bullhead' }}
          TREE: ${{ inputs.tree || 'lineage-22.2' }}
          BUILD_RUN: ${{ (inputs.mode || 'release') == 'publish' && inputs.build_run || github.run_id }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" promote "$TREE" prepare "$BUILD_RUN" true

      - name: Mark as latest and update the feed
        id: upload
        env:
          DEVICE: ${{ inputs.device || 'bullhead' }}
          TREE: ${{ inputs.tree || 'lineage-22.2' }}
          BUILD_RUN: ${{ (inputs.mode || 'release') == 'publish' && inputs.build_run || github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" promote "$TREE" upload "$BUILD_RUN" true
