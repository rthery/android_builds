name: Android build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device codename from devices/<codename>
        required: true
        type: string
        default: bullhead
      tree:
        description: Source tree (eos-t, or a devices/<codename>/<tree> recipe)
        required: true
        type: choice
        options:
          - eos-t
          - lineage-22.2
      mode:
        description: Build operation
        required: true
        type: choice
        options:
          - verify
          - development
          - release
          - publish
          - promote
      build_run:
        description: For publish and promote, the run id of the release build
        required: false
        type: string
      update_feed:
        description: For publish, also replace the Updater feed asset (promote always does)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rom-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'rthery' && github.triggering_actor == 'rthery' && github.ref == 'refs/heads/main' && inputs.mode != 'publish' && inputs.mode != 'promote'
    runs-on: [self-hosted, Linux, X64, rom-builder]
    timeout-minutes: 1440
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow revision
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${SERVER_URL}/${REPOSITORY}.git"
          else
            git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          fi
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --force --detach FETCH_HEAD

      - name: Run the shared build wrapper
        id: build
        env:
          DEVICE: ${{ inputs.device }}
          TREE: ${{ inputs.tree }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" "$MODE" "$TREE"

      - name: Attest the target-files
        if: inputs.mode == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.target_files }}

  publish:
    if: github.actor == 'rthery' && github.triggering_actor == 'rthery' && github.ref == 'refs/heads/main' && (inputs.mode == 'publish' || inputs.mode == 'promote')
    runs-on: [self-hosted, Linux, X64, rom-builder]
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow revision
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${SERVER_URL}/${REPOSITORY}.git"
          else
            git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          fi
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --force --detach FETCH_HEAD

      - name: Check the signed package
        id: prepare
        env:
          DEVICE: ${{ inputs.device }}
          TREE: ${{ inputs.tree }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN: ${{ inputs.build_run }}
          UPDATE_FEED: ${{ inputs.update_feed }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" "$MODE" "$TREE" prepare "$BUILD_RUN" "$UPDATE_FEED"

      # A promoted release keeps the attestation of the run that published it.
      - name: Attest the package
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.package }}

      - name: Upload the release
        env:
          DEVICE: ${{ inputs.device }}
          TREE: ${{ inputs.tree }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN: ${{ inputs.build_run }}
          UPDATE_FEED: ${{ inputs.update_feed }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./scripts/ci-build.sh "$DEVICE" "$MODE" "$TREE" upload "$BUILD_RUN" "$UPDATE_FEED"
